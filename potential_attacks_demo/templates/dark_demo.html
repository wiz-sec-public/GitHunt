<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHEU Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #111827;
            color: #fff;
        }
    </style>
</head>
<body class="p-8">
    <div class="container mx-auto">
        <div class="flex justify-start mb-8">
            <a href="/case/3" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Case: Adyen</a>
        </div>

        <h1 class="text-2xl font-bold mb-4">Potential Attacks</h1>

        <div class="flex flex-col">
            <!-- Header -->
            <div class="grid grid-cols-6 gap-4 p-4 font-bold border-b border-gray-700 bg-gray-800 rounded-t-lg">
                <div class="col-span-1">Created At</div>
                <div class="col-span-1">Actor Login</div>
                <div class="col-span-1">Event Type</div>
                <div class="col-span-1">Repo Name</div>
                <div class="col-span-2">Ref</div>
            </div>
            <!-- Rows -->
            {% for attack in attacks %}
            <div class="grid grid-cols-6 gap-4 p-4 border-b border-gray-800 hover:bg-gray-700">
                <div class="col-span-1">{{ attack.created_at }}</div>
                <div class="col-span-1">{{ attack.actor_login }}</div>
                <div class="col-span-1">{{ attack.event_type }}</div>
                <div class="col-span-1 break-words">{{ attack.repo_name }}</div>
                <div class="col-span-2 break-words">{{ attack.coalesced_ref }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
